<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Yujung Kim | UI Design</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Lato:ital,wght@0,300;0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body class="collage-outer">
  
  <div class="cloud-1 collage-deco"></div>
  <div class="star-deco-top collage-deco"></div>
  <div class="lion-deco-bottom collage-deco"></div>

  <div class="main-content-page">
    
    <header class="header-section">
      <h1 class="groovy-title multi-color-title">
        <span class="color-pink">Y</span>
        <span class="color-brown">u</span>
        <span class="color-yellow">j</span>
        <span class="color-green">u</span>
        <span class="color-red">n</span>
        <span class="color-blue">g</span>
      </h1>
      <p class="subtitle">yaaaaaaaaaayyy</p>
    </header>

    <ul class="floating-favourites-list">
      
      <li class="floating-fav-item fav-food">
        <span class="emoji-container red">🍣</span>
        <span class="reveal-content-text">My favorite food is sushi</span>
      </li>

      <li class="floating-fav-item fav-song">
        <span class="emoji-container yellow">🎵</span>
        <span class="reveal-content-text">My favorite song is Sincerity is Scary</span>
      </li>

      <li class="floating-fav-item fav-website">
        <span class="emoji-container blue">🕹️</span>
        <span class="reveal-content-wrapper">
          <span class="reveal-content-text">My favorite website is Tetrio</span>
          <a href="https://tetr.io" class="cutout-btn">Play Tetrio!</a>
        </span>
      </li>

    </ul>

    <div class="exercises-area">
      <h3 class="exercises-title">Exercises</h3>
      <ul class="exercises-list">
        <li>👉 <a href="ascii_town/ascii_town_exterior.html" class="inline-link-blue">ASCII Town</a></li>
      </ul>
    </div>

  </div>

</body>
</html>
