<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Yujung Kim | UI Design</title>
  <link rel="stylesheet" href="assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="poster-container">
    
    <header class="header-section">
      <h1 class="groovy-title">
        <span class="color-pink">Y</span>
        <span class="color-brown">u</span>
        <span class="color-yellow">j</span>
        <span class="color-green">u</span>
        <span class="color-red">n</span>
        <span class="color-blue">g</span>
      </h1>
      <p class="subtitle">yaaaaaaaaaayyy</p>
    </header>

    <div class="content-grid">
      
      <ul class="info-list">
        <li>
          <div class="blob shape-1 bg-red"><span class="emoji">🍣</span></div>
          <span class="text">My favorite food is sushi</span>
        </li>
        <li>
          <div class="blob shape-2 bg-yellow"><span class="emoji">🎵</span></div>
          <span class="text">My favorite song is Sincerity is Scary</span>
        </li>
        <li class="website-item">
          <div class="blob shape-3 bg-blue"><span class="emoji">🕹️</span></div>
          <span class="text">My favorite website is Tetrio</span>
          <a href="https://tetr.io" class="cutout-btn">Play Tetrio!</a>
        </li>
      </ul>

      <div class="exercises-section">
        <h3 class="section-title">Exercises</h3>
        <ul class="info-list">
          <li>
            <div class="blob shape-4 bg-green"><span class="emoji">✏️</span></div>
            <a href="ascii_town/ascii_town_exterior.html" class="exercise-link">ASCII Town</a>
          </li>
        </ul>
      </div>

    </div>
  </div>

</body>
</html>
