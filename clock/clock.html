<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>newton's clock</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden; 
      background-image: url('ground.png');
      background-size: cover;
      background-position: center;
      background-color: #2c2c2c; 
      
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none; 
      -webkit-user-select: none;
      position: relative;
    }

    .canvas-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none; 
    }

    canvas {
      max-width: 100%;
      display: block;
    }

    .controls-container {
      position: absolute;
      bottom: 40px;
      left: 40px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- REFINED DIGITAL TIME DISPLAY --- */
    .time-display {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div class="canvas-wrapper">
    <canvas id="appleClock" width="700" height="700"></canvas>
  </div>

  <div class="controls-container">
    <div class="time-display" id="timeDisplay">12 : 00</div>
  </div>

  <script>
    const canvas = document.getElementById('appleClock');
    const ctx = canvas.getContext('2d');
    
    const offCanvas = document.createElement('canvas');
    offCanvas.width = canvas.width;
    offCanvas.height = canvas.height;
    const offCtx = offCanvas.getContext('2d');

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const appleSize = 550; 

    const timeDisplay = document.getElementById('timeDisplay');

    // --- STRICT SWARM LOGIC ---
    const rawBites = [];
    for (let i = 0; i < 2500; i++) {
        const radius = Math.sqrt(Math.random()) * 260; 
        const angle = Math.random() * Math.PI * 2;
        const size = 12 + Math.random() * 25; 
        const distScore = radius + (Math.random() * 30 - 15);

        rawBites.push({
            x: cx + Math.cos(angle) * radius,
            y: cy + Math.sin(angle) * radius,
            size: size,
            radius: radius, 
            distScore: distScore
        });
    }
    rawBites.sort((a, b) => b.distScore - a.distScore);

    const minuteBites = Array.from({length: 59}, () => []);
    const outerBites = [];
    const coreBites = [];

    rawBites.forEach(bite => {
        if (bite.radius - bite.size < 35) coreBites.push(bite); 
        else outerBites.push(bite); 
    });

    const totalOuterMinutes = 58;
    const dotsPerMinute = Math.ceil(outerBites.length / totalOuterMinutes);
    
    for(let i = 0; i < outerBites.length; i++) {
        const chunkIndex = Math.floor(i / dotsPerMinute);
        if(chunkIndex < totalOuterMinutes) minuteBites[chunkIndex].push(outerBites[i]);
        else minuteBites[totalOuterMinutes - 1].push(outerBites[i]); 
    }

    minuteBites[58] = minuteBites[58].concat(coreBites);
    minuteBites[58].push({ x: cx, y: cy, size: 200 });

    // --- IMAGE LOADING ---
    const appleImages = [];
    let imagesLoaded = 0;
    const totalImages = 12;

    for (let i = 0; i < totalImages; i++) {
        const img = new Image();
        const indexStr = String(i).padStart(2, '0');
        img.src = `apple${indexStr}.png`;
        
        img.onload = () => {
            imagesLoaded++;
            // Initial render once all images are ready
            if (imagesLoaded === totalImages) updateTime();
        };
        
        img.onerror = () => console.error(`Failed to load apple${indexStr}.png`);
        appleImages.push(img);
    }

    // --- TIME TRACKING STATE ---
    let prevHour = new Date().getHours();
    let initialLoad = true;

    // --- DROP ANIMATION ---
    function startDropAnimation() {
        canvas.style.transition = 'none';
        canvas.style.transform = 'scale(3)';
        void canvas.offsetWidth; 
        canvas.style.transition = 'transform 0.4s cubic-bezier(0.5, 0, 1, 1)';
        canvas.style.transform = 'scale(1)';
    }

    // --- AUTOMATIC TIME UPDATE ---
    function updateTime() {
        if (imagesLoaded < totalImages) return;

        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const totalMinutes = hours * 60 + minutes;

        // Update digital display
        timeDisplay.textContent = `${String(hours).padStart(2, '0')} : ${String(minutes).padStart(2, '0')}`;

        // Trigger drop animation on the hour mark (skip on initial page load)
        if (hours !== prevHour) {
            if (!initialLoad) {
                startDropAnimation();
            }
            prevHour = hours;
        }
        
        initialLoad = false;
        renderCanvas(totalMinutes);
    }

    // --- ADVANCED RENDERING WITH DYNAMIC SHADOW ---
    function renderCanvas(totalMinutes) {
        const hours = Math.floor(totalMinutes / 60);
        const minutes = Math.floor(totalMinutes % 60);
        const currentHourImageIndex = hours % 12;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
        
        offCtx.globalCompositeOperation = 'source-over';
        offCtx.drawImage(appleImages[currentHourImageIndex], cx - appleSize/2, cy - appleSize/2, appleSize, appleSize);
        
        offCtx.globalCompositeOperation = 'destination-out';
        offCtx.fillStyle = 'black'; 
        
        for (let i = 0; i < minutes; i++) {
            const chunk = minuteBites[i];
            for (let j = 0; j < chunk.length; j++) {
                offCtx.beginPath();
                offCtx.arc(chunk[j].x, chunk[j].y, chunk[j].size, 0, Math.PI * 2);
                offCtx.fill();
            }
        }

        ctx.save(); 
        
        // Apply dynamic shadow based on the remaining eaten apple shape
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)'; 
        ctx.shadowBlur = 40; 
        ctx.shadowOffsetX = 0; 
        ctx.shadowOffsetY = 0; 
        
        // Stamp off-screen canvas to main canvas
        ctx.drawImage(offCanvas, 0, 0); 
        
        ctx.restore(); 
    }

    // Start the clock loop (checks the time every 1000 milliseconds / 1 second)
    setInterval(updateTime, 1000);
    
    // Call once immediately to set the initial state (will render once images load)
    updateTime();

  </script>
</body>
</html>
